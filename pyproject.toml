[project]
name = "dbsare"
version = "0.1.0"
description = "DeepBlackStone Adaptive Reasoning Engine"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dbsare = "dbsare.cli:main"

[tool.setuptools.packages.find]
include = ["dbsare*"]
